<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a121d" />
      <stop offset="50%" stop-color="#14141a" />
      <stop offset="100%" stop-color="#261612" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <linearGradient id="chaiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Ambient glow inside -->
  <circle cx="32" cy="36" r="18" fill="#f43f5e" opacity="0.3" filter="url(#glow)" />

  <!-- Steam wisps -->
  <path d="M26 22 Q23 16 26 11 Q28 8 27 6" fill="none" stroke="url(#steamGrad)" stroke-width="2.2" stroke-linecap="round" />
  <path d="M33 20 Q36 14 33 10 Q31 7 34 5" fill="none" stroke="url(#steamGrad)" stroke-width="2.4" stroke-linecap="round" />
  <path d="M40 22 Q37 17 40 12 Q42 9 40 7" fill="none" stroke="url(#steamGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Chai Cup Body -->
  <path d="M19 26 L22 43 Q23 48 32 48 Q41 48 42 43 L45 26 Z" fill="url(#cupGrad)" stroke="#ea580c" stroke-width="1" />

  <!-- Liquid inside cup rim -->
  <ellipse cx="32" cy="26" rx="13" ry="3.5" fill="url(#chaiGrad)" />
  <ellipse cx="32" cy="26" rx="10.5" ry="2.2" fill="#9a3412" opacity="0.65" />

  <!-- Cup Handle -->
  <path d="M44 29 C50 29 51 40 42 41" fill="none" stroke="url(#cupGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Saucer Plate -->
  <ellipse cx="32" cy="50.5" rx="19" ry="3" fill="#fdba74" opacity="0.95" />
  <ellipse cx="32" cy="50" rx="16" ry="1.8" fill="#ea580c" opacity="0.6" />

  <!-- Ruby Live Dot -->
  <circle cx="52" cy="12" r="4.5" fill="#f43f5e" stroke="#14141a" stroke-width="1.5" />
  <circle cx="52" cy="12" r="2" fill="#ffffff" />
</svg>
